name: Release Monitor

on:
  release:
    types: [published]

jobs:
  parse-release:
    name: Parse Release Information
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to access tags

      - name: Parse release tag and extract information
        id: parse
        run: |
          # Get the release tag name
          TAG_NAME="${{ github.event.release.tag_name }}"
          echo "Release tag: $TAG_NAME"

          # Parse the tag format: <submodule-name>-v<semantic-version> OR <submodule-name>/v<semantic-version>
          # Examples: eks-cluster-v1.0.0, eks-node-groups-v1.0.1, regional-eks/v0.1.0

          if [[ $TAG_NAME =~ ^(.+)[-/]v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            SUBMODULE_NAME="${BASH_REMATCH[1]}"
            SEMANTIC_VERSION="${BASH_REMATCH[2]}"

            # Construct the submodule path
            # Convention: modules/<submodule-name>
            SUBMODULE_PATH="modules/${SUBMODULE_NAME}"

            # Verify the submodule path exists
            if [ -d "$SUBMODULE_PATH" ]; then
              echo "✅ Submodule found at: $SUBMODULE_PATH"
              EXISTS="true"
            else
              echo "⚠️ Warning: Submodule path does not exist: $SUBMODULE_PATH"
              EXISTS="false"
            fi

            # Output parsed information
            echo "submodule_name=$SUBMODULE_NAME" >> $GITHUB_OUTPUT
            echo "semantic_version=$SEMANTIC_VERSION" >> $GITHUB_OUTPUT
            echo "submodule_path=$SUBMODULE_PATH" >> $GITHUB_OUTPUT
            echo "path_exists=$EXISTS" >> $GITHUB_OUTPUT

          else
            echo "❌ Error: Tag name does not match expected format"
            echo "   Expected formats:"
            echo "     - <submodule-name>-v<semantic-version> (e.g., eks-cluster-v1.0.0)"
            echo "     - <submodule-name>/v<semantic-version> (e.g., regional-eks/v0.1.0)"
            echo "   Received: $TAG_NAME"
            exit 1
          fi

      - name: Update release name to match tag (with forward slash format)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = context.payload.release.tag_name;
            const currentName = context.payload.release.name;
            
            // Convert tag format from hyphen to forward slash
            // e.g., rds-v0.1.0 -> rds/v0.1.0
            // Matches pattern: <module>-v<version> or <module>/v<version>
            const normalizedName = tagName.replace(/^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$/, '$1/v$2');
            
            // Use normalized name if conversion occurred, otherwise use original tag
            const releaseName = normalizedName !== tagName ? normalizedName : tagName;
            
            // Only update if the name doesn't already match the desired format
            if (currentName !== releaseName) {
              console.log(`Updating release name from "${currentName}" to "${releaseName}"`);
              console.log(`Tag format: "${tagName}" -> Release name format: "${releaseName}"`);
              
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                name: releaseName,
                body: context.payload.release.body,
                draft: context.payload.release.draft,
                prerelease: context.payload.release.prerelease
              });
              
              console.log(`✅ Release name updated to "${releaseName}"`);
            } else {
              console.log(`Release name already matches desired format: "${releaseName}"`);
            }

      - name: Display release information
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 NEW RELEASE PUBLISHED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📌 Release Tag:       ${{ github.event.release.tag_name }}"
          echo "📂 Submodule Name:    ${{ steps.parse.outputs.submodule_name }}"
          echo "🔢 Semantic Version:  ${{ steps.parse.outputs.semantic_version }}"
          echo "📁 Submodule Path:    ${{ steps.parse.outputs.submodule_path }}"
          echo "✓  Path Exists:       ${{ steps.parse.outputs.path_exists }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📝 Release Details:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Title:     ${{ github.event.release.name }}"
          echo "Author:    ${{ github.event.release.author.login }}"
          echo "Created:   ${{ github.event.release.created_at }}"
          echo "Published: ${{ github.event.release.published_at }}"
          echo "URL:       ${{ github.event.release.html_url }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Parse semantic version components
        run: |
          VERSION="${{ steps.parse.outputs.semantic_version }}"

          # Split semantic version into components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔢 SEMANTIC VERSION BREAKDOWN"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Full Version:  $VERSION"
          echo "Major:         $MAJOR"
          echo "Minor:         $MINOR"
          echo "Patch:         $PATCH"
          echo ""

          # Determine release type
          if [ "$MAJOR" -gt "0" ]; then
            if [ "$MINOR" -eq "0" ] && [ "$PATCH" -eq "0" ]; then
              RELEASE_TYPE="🚀 MAJOR RELEASE (Breaking Changes)"
            elif [ "$PATCH" -eq "0" ]; then
              RELEASE_TYPE="✨ MINOR RELEASE (New Features)"
            else
              RELEASE_TYPE="🔧 PATCH RELEASE (Bug Fixes)"
            fi
          else
            RELEASE_TYPE="🧪 PRE-RELEASE (Development)"
          fi

          echo "Release Type:  $RELEASE_TYPE"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: List submodule contents
        if: steps.parse.outputs.path_exists == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📂 SUBMODULE CONTENTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Path: ${{ steps.parse.outputs.submodule_path }}"
          echo ""
          ls -lah "${{ steps.parse.outputs.submodule_path }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Detect changed files in release
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          SUBMODULE_PATH="${{ steps.parse.outputs.submodule_path }}"
          SUBMODULE_NAME="${{ steps.parse.outputs.submodule_name }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📝 CHANGED FILES IN THIS RELEASE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # Get the commit associated with this tag
          TAG_COMMIT=$(git rev-list -n 1 $TAG_NAME)

          # Get the previous tag for this submodule (support both - and / formats)
          PREVIOUS_TAG=$(git tag -l "${SUBMODULE_NAME}-v*" "${SUBMODULE_NAME}/v*" --sort=-version:refname | head -n 2 | tail -n 1)

          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$TAG_NAME" ]; then
            echo "Comparing: $PREVIOUS_TAG → $TAG_NAME"
            echo ""
            echo "Changed files in ${SUBMODULE_PATH}:"
            echo ""
            git diff --name-status $PREVIOUS_TAG $TAG_NAME -- $SUBMODULE_PATH
          else
            echo "This is the first release for this submodule"
            echo ""
            echo "Files in ${SUBMODULE_PATH}:"
            echo ""
            git ls-tree -r --name-only $TAG_COMMIT $SUBMODULE_PATH
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Install StackGen CLI
        if: steps.parse.outputs.path_exists == 'true'
        id: install_stackgen
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 INSTALLING STACKGEN CLI"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Check if stackgen is already installed
          if command -v stackgen &> /dev/null; then
            echo "✅ StackGen CLI already installed"
            stackgen version 2>/dev/null || echo "StackGen CLI found (version check not available)"
            echo "stackgen_available=true" >> $GITHUB_OUTPUT
          else
            echo "Installing StackGen CLI via Homebrew..."
            
            # Ensure git is installed (required for StackGen)
            if ! command -v git &> /dev/null; then
              echo "Installing git..."
              sudo apt-get update && sudo apt-get install -y git || \
              sudo yum install -y git || \
              brew install git || \
              { echo "❌ Failed to install git. Please ensure git is available."; exit 1; }
            fi
            echo "✅ Git is available"
            
            # Install Homebrew if not available (for Linux runners)
            if ! command -v brew &> /dev/null; then
              echo "Installing Homebrew..."
              /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              
              # Add Homebrew to PATH for current session and future sessions
              if [ -d "/home/linuxbrew/.linuxbrew" ]; then
                echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.bashrc
                eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                echo "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" >> $GITHUB_ENV
              elif [ -d "/opt/homebrew" ]; then
                echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.bashrc
                eval "$(/opt/homebrew/bin/brew shellenv)"
                echo "$(/opt/homebrew/bin/brew shellenv)" >> $GITHUB_ENV
              fi
              
              # Verify Homebrew installation
              if ! command -v brew &> /dev/null; then
                echo "❌ Failed to install Homebrew"
                exit 1
              fi
              echo "✅ Homebrew installed"
            else
              echo "✅ Homebrew is already installed"
              # Ensure brew is in PATH for this step
              if [ -d "/home/linuxbrew/.linuxbrew" ]; then
                eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
              elif [ -d "/opt/homebrew" ]; then
                eval "$(/opt/homebrew/bin/brew shellenv)"
              fi
            fi
            
            # Install StackGen CLI via Homebrew
            echo "Installing StackGen CLI from Homebrew tap..."
            brew install stackgenhq/stackgen/stackgen || {
              echo "❌ Failed to install StackGen CLI via Homebrew"
              echo "Attempting to add tap manually..."
              brew tap stackgenhq/stackgen || exit 1
              brew install stackgenhq/stackgen/stackgen || exit 1
            }
            
            # Verify installation and ensure it's in PATH
            # Refresh PATH to include Homebrew binaries
            if [ -d "/home/linuxbrew/.linuxbrew" ]; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            elif [ -d "/opt/homebrew" ]; then
              eval "$(/opt/homebrew/bin/brew shellenv)"
            fi
            
            # Find stackgen in PATH
            STACKGEN_PATH=$(which stackgen 2>/dev/null || command -v stackgen 2>/dev/null || echo "")
            
            if [ -n "$STACKGEN_PATH" ] && command -v stackgen &> /dev/null; then
              echo "✅ StackGen CLI installed successfully"
              echo "Location: $STACKGEN_PATH"
              stackgen version 2>/dev/null || echo "StackGen CLI installed (version check not available)"
              echo "stackgen_available=true" >> $GITHUB_OUTPUT
              
              # Ensure PATH includes Homebrew bin for subsequent steps
              if [ -d "/home/linuxbrew/.linuxbrew/bin" ]; then
                echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
              elif [ -d "/opt/homebrew/bin" ]; then
                echo "/opt/homebrew/bin" >> $GITHUB_PATH
              fi
            else
              echo "❌ Failed to install StackGen CLI"
              echo "Please check the installation logs above for errors"
              exit 1
            fi
          fi
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Upload custom module to StackGen
        if: steps.parse.outputs.path_exists == 'true'
        env:
          STACKGEN_PROVIDER: ${{ vars.STACKGEN_PROVIDER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STACKGEN_TOKEN: ${{ secrets.STACKGEN_TOKEN }}
          STACKGEN_URL: ${{ vars.STACKGEN_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          MODULE_DIR: ${{ steps.parse.outputs.submodule_path }}
          MODULE_VERSION: v${{ steps.parse.outputs.semantic_version }}
          SCM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Refresh PATH to ensure Homebrew binaries are available
          if [ -d "/home/linuxbrew/.linuxbrew" ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          elif [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          
          # Verify StackGen CLI is available
          if ! command -v stackgen &> /dev/null; then
            echo "❌ StackGen CLI is not available"
            echo "Please ensure StackGen CLI is installed before running the upload step"
            echo "Check the 'Install StackGen CLI' step for installation instructions"
            exit 1
          fi
          
          # Verify STACKGEN_TOKEN is set
          if [ -z "$STACKGEN_TOKEN" ]; then
            echo "❌ STACKGEN_TOKEN is not set"
            echo "Please set the STACKGEN_TOKEN secret in your repository settings"
            echo "You can generate a token from: https://cloud.stackgen.com/account-settings/pat"
            exit 1
          fi
          
          # Verify STACKGEN_URL is set
          if [ -z "$STACKGEN_URL" ]; then
            echo "❌ STACKGEN_URL is not set"
            echo "Please set the STACKGEN_URL variable in your repository settings"
            echo "Go to: Settings → Secrets and variables → Actions → Variables"
            echo "Add a new repository variable named STACKGEN_URL with your StackGen URL"
            exit 1
          fi
          
          # Set provider from environment variable or default to aws
          PROVIDER="${STACKGEN_PROVIDER:-aws}"
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤 UPLOADING CUSTOM MODULE TO STACKGEN"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "StackGen CLI version:"
          stackgen version 2>/dev/null || echo "StackGen CLI available (version check not available)"
          echo ""
          echo "Provider:     $PROVIDER"
          echo "StackGen URL: $STACKGEN_URL"
          echo "Module Dir:   $MODULE_DIR"
          echo "Repo URL:     $REPO_URL"
          echo "Tag:          $MODULE_VERSION"
          echo ""
          
          env
          
          stackgen upload custom-modules \
            --dir $MODULE_DIR \
            --provider $PROVIDER \
            --repo-url $REPO_URL \
            --tag $MODULE_VERSION \
            --overwrite-version \
            --log 2
          
          echo ""
          echo "✅ Custom module uploaded successfully"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ RELEASE MONITORING COMPLETE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Summary:"
          echo "  • Submodule: ${{ steps.parse.outputs.submodule_name }}"
          echo "  • Version:   v${{ steps.parse.outputs.semantic_version }}"
          echo "  • Path:      ${{ steps.parse.outputs.submodule_path }}"
          echo "  • Status:    Published ✓"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
